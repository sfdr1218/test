<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="一个集成多种实用工具和网页收藏管理的Web应用，提供图片处理、文档转换、二维码操作等内置工具，支持收藏网页、搜索过滤、拖拽排序和自定义展示顺序功能。" />
<meta property="og:title" content="工具与网页合集门户" />
<title>工具与网页合集门户</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --radius: 2px;
    --bg: #f8fafb;
    --fg: #23283a;
    --card: #ffffff;
    --card-fg: #23283a;
    --primary: #6976c8;
    --primary-fg: #ffffff;
    --secondary: #eef0f7;
    --muted: #f0f3f5;
    --muted-fg: #697079;
    --accent: #eef0f7;
    --destructive: #db4444;
    --border: #dddfe7;
    --ring: #6976c8;
    --shadow: 0 1px 3px rgba(16, 24, 40, .06), 0 1px 2px rgba(16, 24, 40, .04);
    --shadow-lg: 0 10px 30px -6px rgba(16, 24, 40, .18);
    --font-sans: "Inter Tight", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #08090c;
      --fg: #f3f5f9;
      --card: #111219;
      --card-fg: #f3f5f9;
      --primary: #6976c8;
      --primary-fg: #ffffff;
      --secondary: #3f4257;
      --muted: #242529;
      --muted-fg: #969ba9;
      --accent: #3f4257;
      --destructive: #e05a5a;
      --border: #3b3d46;
      --ring: #6976c8;
      --shadow: 0 1px 3px rgba(0, 0, 0, .4), 0 1px 2px rgba(0, 0, 0, .3);
      --shadow-lg: 0 10px 30px -6px rgba(0, 0, 0, .6);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }

  .app { min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; z-index: 30;
    border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(8px);
  }
  .header-inner {
    max-width: 72rem; margin: 0 auto; padding: .75rem 1rem;
    display: flex; align-items: center; gap: .75rem;
  }
  @media (min-width: 768px) { .header-inner { padding: .75rem 1.5rem; } }
  .brand { display: flex; align-items: center; gap: .5rem; flex-shrink: 0; }
  .brand-icon {
    display: flex; width: 2rem; height: 2rem; align-items: center; justify-content: center;
    border: 1px solid color-mix(in srgb, var(--primary) 50%, transparent);
    background: color-mix(in srgb, var(--primary) 10%, transparent);
    color: var(--primary); border-radius: var(--radius);
  }
  .brand-title { display: none; font-size: .875rem; font-weight: 600; letter-spacing: -.02em; }
  @media (min-width: 768px) { .brand-title { display: inline; } }
  .search-wrap { position: relative; flex: 1; min-width: 0; }
  .search-icon {
    position: absolute; left: .75rem; top: 50%; transform: translateY(-50%);
    width: 1rem; height: 1rem; color: var(--muted-fg); pointer-events: none;
  }
  .search-input {
    width: 100%; height: 2.5rem; padding: 0 .75rem 0 2.25rem;
    border-radius: var(--radius); border: 1px solid var(--border);
    background: color-mix(in srgb, var(--muted) 30%, transparent);
    color: var(--fg); font-size: .875rem; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search-input::placeholder { color: var(--muted-fg); }
  .search-input:focus { border-color: var(--ring); box-shadow: 0 0 0 1px var(--ring); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .375rem;
    height: 2.25rem; padding: 0 .875rem; border-radius: var(--radius);
    border: 1px solid transparent; font-size: .875rem; font-weight: 500;
    white-space: nowrap; transition: background .15s, border-color .15s, color .15s, opacity .15s;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-sm { height: 2rem; padding: 0 .75rem; font-size: .8125rem; }
  .btn-icon { width: 2rem; padding: 0; }
  .btn-primary { background: var(--primary); color: var(--primary-fg); }
  .btn-primary:hover:not(:disabled) { background: color-mix(in srgb, var(--primary) 90%, #000); }
  .btn-secondary { background: var(--secondary); color: var(--secondary-fg, var(--fg)); }
  .btn-secondary:hover:not(:disabled) { background: color-mix(in srgb, var(--secondary) 88%, #000); }
  .btn-outline { background: transparent; color: var(--fg); border-color: var(--border); }
  .btn-outline:hover { background: var(--muted); }
  .btn-ghost { background: transparent; color: var(--fg); }
  .btn-ghost:hover { background: var(--muted); }
  .btn-danger { color: var(--destructive); }
  .btn-danger:hover { background: color-mix(in srgb, var(--destructive) 8%, transparent); }
  .btn svg { width: 1rem; height: 1rem; flex-shrink: 0; }
  .btn-sm svg { width: .875rem; height: .875rem; }

  /* ---------- Main ---------- */
  main { flex: 1; width: 100%; max-width: 72rem; margin: 0 auto; padding: 1.5rem 1rem; }
  @media (min-width: 768px) { main { padding: 1.5rem; } }
  .main-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
  .count { font-size: .875rem; color: var(--muted-fg); }
  .count b { font-family: var(--font-mono); color: var(--primary); font-weight: 600; }
  .manage-hint {
    margin-bottom: 1rem; border: 1px solid color-mix(in srgb, var(--primary) 30%, transparent);
    background: color-mix(in srgb, var(--primary) 5%, transparent);
    border-radius: var(--radius); padding: .625rem 1rem;
    font-size: .875rem; color: var(--muted-fg);
  }
  .grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: .75rem;
  }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); gap: .875rem; } }
  @media (min-width: 960px) { .grid { grid-template-columns: repeat(6, 1fr); gap: 1rem; } }

  /* ---------- Card ---------- */
  .card {
    position: relative; display: flex; flex-direction: column; height: 100%;
    border: 1px solid var(--border); background: var(--card); color: var(--card-fg);
    border-radius: var(--radius); padding: 1rem;
    transition: border-color .15s, opacity .15s, box-shadow .15s;
  }
  .card.clickable { cursor: pointer; }
  .card.clickable:hover { border-color: color-mix(in srgb, var(--primary) 70%, var(--border)); }
  .card.grab { cursor: grab; }
  .card.grab:active { cursor: grabbing; }
  .card.dragging { opacity: .4; }
  .card.drag-over { border-color: var(--primary); box-shadow: 0 0 0 1px color-mix(in srgb, var(--primary) 40%, transparent); }
  .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: .75rem; }
  .card-index { font-family: var(--font-mono); font-size: .8125rem; color: var(--muted-fg); }
  .card-top svg { width: 1rem; height: 1rem; color: var(--muted-fg); }
  .card-top .link-ico { opacity: 0; transition: opacity .15s; }
  .card:hover .card-top .link-ico { opacity: 1; }
  .card-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .75rem; padding: .5rem 0; text-align: center; }
  .card-icon {
    display: flex; width: 3.25rem; height: 3.25rem; align-items: center; justify-content: center;
    border: 1px solid var(--border); background: color-mix(in srgb, var(--muted) 30%, transparent);
    color: var(--primary); border-radius: var(--radius); overflow: hidden;
  }
  .card-icon svg { width: 1.75rem; height: 1.75rem; }
  .card-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-name { font-size: 1rem; font-weight: 600; word-break: break-word; text-wrap: balance; }
  .rename-row { display: flex; width: 100%; align-items: center; gap: .25rem; }
  .rename-input {
    height: 2rem; padding: 0 .5rem; text-align: center; font-size: .875rem;
    border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg); color: var(--fg);
    outline: none; flex: 1; min-width: 0;
  }
  .rename-input:focus { border-color: var(--ring); box-shadow: 0 0 0 1px var(--ring); }
  .card-actions {
    margin-top: .75rem; display: flex; align-items: center; justify-content: flex-end; gap: .25rem;
    border-top: 1px solid var(--border); padding-top: .5rem;
  }
  .card-actions .btn { height: 1.75rem; padding: 0 .5rem; font-size: .8125rem; color: var(--muted-fg); }
  .card-actions .btn:hover { color: var(--fg); background: var(--muted); }
  .card-actions .btn svg { width: .875rem; height: .875rem; margin-right: .25rem; }

  /* ---------- Empty ---------- */
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .75rem; padding: 6rem 0; text-align: center; }
  .empty svg { width: 2.5rem; height: 2.5rem; color: var(--muted-fg); }
  .empty p { font-size: .875rem; color: var(--muted-fg); }

  /* ---------- Dialog ---------- */
  .dialog-overlay {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .45); padding: 1rem;
    animation: fadeIn .12s ease-out;
  }
  .dialog-overlay.hidden { display: none; }
  .dialog {
    width: 100%; max-width: 32rem; max-height: calc(100vh - 2rem);
    background: var(--card); color: var(--card-fg);
    border-radius: calc(var(--radius) + 2px); box-shadow: var(--shadow-lg);
    display: flex; flex-direction: column; overflow: hidden;
    animation: zoomIn .14s ease-out;
  }
  .dialog.tool-dialog { max-width: 32rem; }
  .dialog.narrow { max-width: 28rem; }
  .dialog-header { padding: 1.25rem 1.5rem .25rem; }
  .dialog-title { font-size: 1.125rem; font-weight: 600; line-height: 1.2; letter-spacing: -.01em; font-family: var(--font-mono); font-size: 1rem; }
  .dialog-desc { margin-top: .25rem; font-size: .875rem; color: var(--muted-fg); }
  .dialog-body { padding: .75rem 1.5rem 1rem; overflow-y: auto; }
  .dialog-footer { padding: .75rem 1.5rem 1.25rem; display: flex; justify-content: flex-end; }
  .dialog-close { position: absolute; top: 1rem; right: 1rem; color: var(--muted-fg); }
  .space-y-6 > * + * { margin-top: 1.5rem; }
  .space-y-3 > * + * { margin-top: .75rem; }
  .space-y-2 > * + * { margin-top: .5rem; }
  .space-y-4 > * + * { margin-top: 1rem; }

  /* ---------- Dropzone ---------- */
  .dropzone {
    border: 1px dashed var(--border); background: color-mix(in srgb, var(--muted) 30%, transparent);
    border-radius: var(--radius); padding: 2rem; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .dropzone:hover { border-color: color-mix(in srgb, var(--primary) 60%, var(--border)); }
  .dropzone svg { width: 2rem; height: 2rem; color: var(--muted-fg); margin: 0 auto .75rem; display: block; }
  .dropzone p { font-size: .875rem; color: var(--muted-fg); }
  .dropzone.highlight { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 8%, transparent); }
  .file-info { display: flex; align-items: center; justify-content: space-between; gap: .5rem; font-size: .875rem; }
  .file-info .name { color: var(--muted-fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-info .size { font-family: var(--font-mono); color: var(--muted-fg); white-space: nowrap; }
  .preview { width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: var(--radius); border: 1px solid var(--border); background: color-mix(in srgb, var(--muted) 20%, transparent); }
  .preview img { width: 100%; height: 100%; object-fit: contain; }

  /* ---------- Slider ---------- */
  .slider-row { display: flex; align-items: center; justify-content: space-between; font-size: .875rem; }
  .slider-row span { color: var(--muted-fg); }
  .slider-row b { font-family: var(--font-mono); color: var(--primary); font-weight: 600; }
  input[type="range"] {
    width: 100%; height: 1.25rem; margin: .25rem 0; -webkit-appearance: none; appearance: none;
    background: transparent; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--border); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 14px; height: 14px; margin-top: -5px;
    border-radius: 50%; background: var(--primary); border: 2px solid var(--card);
    box-shadow: 0 1px 2px rgba(0,0,0,.2);
  }
  input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--border); }
  input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--primary); border: 2px solid var(--card); }

  /* ---------- Inputs / textarea ---------- */
  .field-label { font-size: .875rem; color: var(--muted-fg); display: block; margin-bottom: .5rem; }
  .text-input, .textarea {
    width: 100%; border-radius: var(--radius); border: 1px solid var(--border);
    background: transparent; color: var(--fg); font-size: .875rem; padding: .5rem .75rem;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .text-input::placeholder, .textarea::placeholder { color: var(--muted-fg); }
  .text-input:focus, .textarea:focus { border-color: var(--ring); box-shadow: 0 0 0 1px var(--ring); }
  .textarea { min-height: 6rem; resize: vertical; font-family: inherit; line-height: 1.6; }

  /* ---------- 图标上传 ---------- */
  .icon-drop {
    display: flex; align-items: center; gap: .75rem;
    border: 1px dashed var(--border); border-radius: var(--radius);
    padding: .625rem; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .icon-drop:hover { border-color: var(--primary); }
  .icon-drop.over { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 8%, transparent); }
  .icon-drop-preview {
    width: 3rem; height: 3rem; flex: none; overflow: hidden;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: color-mix(in srgb, var(--muted) 30%, transparent);
    display: flex; align-items: center; justify-content: center; color: var(--muted-fg);
  }
  .icon-drop-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .icon-drop-preview svg { width: 1.5rem; height: 1.5rem; }
  .icon-drop-text { flex: 1; font-size: .8125rem; color: var(--muted-fg); line-height: 1.5; }
  .icon-drop-text b { color: var(--fg); font-weight: 600; }
  .card.icon-drop-over { border-color: var(--primary); box-shadow: 0 0 0 1px color-mix(in srgb, var(--primary) 40%, transparent); }
  .card.icon-drop-over .card-icon { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 15%, transparent); }
  .card.link-card .card-icon { position: relative; }
  .card.link-card .card-icon::after {
    content: '换图标'; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .55); color: #fff; font-size: .75rem;
    border-radius: inherit; opacity: 0; transition: opacity .15s; pointer-events: none;
  }
  .card.link-card .card-icon:hover::after { opacity: 1; }

  /* ---------- Todo ---------- */
  .todo-stats { display: flex; align-items: center; justify-content: space-between; font-size: .875rem; }
  .todo-stats span { color: var(--muted-fg); }
  .todo-stats b { font-family: var(--font-mono); color: var(--primary); font-weight: 600; }
  .todo-add { display: flex; gap: .5rem; }
  .todo-add .text-input { flex: 1; }
  .todo-list { display: flex; flex-direction: column; gap: .5rem; max-height: 18rem; overflow-y: auto; }
  .todo-item {
    display: flex; align-items: center; gap: .75rem;
    border: 1px solid var(--border); background: color-mix(in srgb, var(--muted) 20%, transparent);
    border-radius: var(--radius); padding: .625rem .75rem;
  }
  .todo-label { display: flex; align-items: center; gap: .75rem; flex: 1; min-width: 0; cursor: pointer; }
  .todo-check {
    width: 1rem; height: 1rem; border-radius: var(--radius); border: 1px solid var(--primary);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: background .15s; background: transparent;
  }
  .todo-check svg { width: .75rem; height: .75rem; color: var(--primary-fg); opacity: 0; }
  .todo-item input[type="checkbox"] { display: none; }
  .todo-item input[type="checkbox"]:checked + .todo-check { background: var(--primary); }
  .todo-item input[type="checkbox"]:checked + .todo-check svg { opacity: 1; }
  .todo-text { font-size: .875rem; word-break: break-word; }
  .todo-item input[type="checkbox"]:checked ~ .todo-text { color: var(--muted-fg); text-decoration: line-through; }
  .todo-item .btn-icon { width: 1.75rem; height: 1.75rem; color: var(--muted-fg); flex-shrink: 0; }
  .todo-item .btn-icon:hover { color: var(--destructive); }
  .todo-empty { padding: 2.5rem 0; text-align: center; font-size: .875rem; color: var(--muted-fg); }

  /* ---------- QR ---------- */
  .qr-box { display: flex; flex-direction: column; align-items: center; gap: .75rem; }
  .qr-canvas-wrap { border: 1px solid var(--border); background: var(--card); border-radius: var(--radius); padding: 1rem; }
  .qr-canvas-wrap img { width: 12rem; height: 12rem; display: block; }

  /* ---------- Spinner ---------- */
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes zoomIn { from { opacity: 0; transform: scale(.96) translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---------- Toast ---------- */
  #toast-root { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: .5rem; width: max-content; max-width: min(92vw, 26rem); }
  .toast {
    display: flex; align-items: flex-start; gap: .5rem;
    background: var(--card); color: var(--card-fg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: .625rem .875rem; font-size: .875rem;
    box-shadow: var(--shadow-lg); animation: toastIn .18s ease-out;
  }
  .toast svg { width: 1rem; height: 1rem; flex-shrink: 0; margin-top: 1px; }
  .toast.success svg { color: #22a06b; }
  .toast.error svg { color: var(--destructive); }
  .toast.warning svg { color: #e6a23c; }
  .toast.out { animation: toastOut .2s ease-in forwards; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(-8px); } }

  .w-full { width: 100%; }
  .text-right { text-align: right; }
  .flex-between { display: flex; align-items: center; justify-content: space-between; }
  .result-block { border-top: 1px solid var(--border); padding-top: 1rem; }
  .mono { font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon" id="brand-icon"></div>
        <span class="brand-title">工具合集</span>
      </div>
      <div class="search-wrap">
        <span class="search-icon" id="search-icon"></span>
        <input class="search-input" id="search-input" type="text" placeholder="搜索工具或收藏网页…" autocomplete="off" />
      </div>
      <button class="btn btn-outline" id="manage-btn"></button>
    </div>
  </header>

  <main>
    <div class="main-head">
      <div class="count" id="count-text"></div>
      <button class="btn btn-sm btn-primary" id="add-link-btn" style="display:none;"></button>
    </div>
    <div class="manage-hint" id="manage-hint" style="display:none;">管理模式：拖拽卡片调整顺序；拖动图片到网页卡片可更换图标；点击「编辑」修改名称、图标与网址；收藏的网页可删除</div>
    <div class="grid" id="grid"></div>
    <div class="empty hidden" id="empty-state">
      <span id="empty-icon"></span>
      <p id="empty-text"></p>
    </div>
  </main>
</div>

<!-- Tool dialog -->
<div class="dialog-overlay hidden" id="tool-dialog">
  <div class="dialog tool-dialog" style="position:relative;">
    <div class="dialog-header">
      <div class="dialog-title" id="tool-title"></div>
      <div class="dialog-desc" id="tool-desc"></div>
    </div>
    <div class="dialog-body" id="tool-body"></div>
    <div class="dialog-footer">
      <button class="btn btn-ghost" id="tool-close">关闭</button>
    </div>
  </div>
</div>

<!-- Add/edit link dialog -->
<div class="dialog-overlay hidden" id="link-dialog">
  <div class="dialog narrow">
    <div class="dialog-header">
      <div class="dialog-title" id="link-title">添加收藏网页</div>
      <div class="dialog-desc" id="link-desc">输入网页名称与地址，添加后可在主页点击跳转</div>
    </div>
    <div class="dialog-body">
      <div class="space-y-4">
        <div class="space-y-2">
          <label class="field-label" for="link-name">网页名称</label>

  /* ---------- Toast ---------- */

  /* ============================================================

  function CompressApp() {

        btn.addEventListener('click', onCompress);

      }

      if (result) {
        var rb = document.createElement('div');
        rb.className = 'result-block space-y-3';
        rb.innerHTML = '<div class="file-info"><span class="name">压缩后大小</span><span class="size mono"></span></div>';
        rb.querySelector('.size').textContent = formatBytes(result.blob.size);
        var prev = document.createElement('div');

    function onFile(f) {

      try {
        var img = await loadImage(file);
        var n = img.naturalWidth, r = img.naturalHeight;
        if (n > maxWidth) { r = Math.round(r * maxWidth / n); n = maxWidth; }
        var canvas = document.createElement('canvas');

        var ctx = canvas.getContext('2d');

    function onFile(f) {

    async function onSharpen() {

        canvas.width = n; canvas.height = r;
        var ctx = canvas.getContext('2d');
        if (!ctx) throw new Error('画布初始化失败');
        ctx.drawImage(img, 0, 0);
        var src = ctx.getImageData(0, 0, n, r);
        var out = ctx.createImageData(n, r);
        var d = src.data, f = out.data;
        var p = strength / 100, m = 1 + 4 * p, h = -p;
        for (var y = 1; y < r - 1; y++) {
          for (var x = 1; x < n - 1; x++) {
            var idx = (y * n + x) * 4;
            for (var c = 0; c < 3; c++) {
              var v = d[idx + c] * m + d[idx - 4 + c] * h + d[idx + 4 + c] * h + d[idx - n * 4 + c] * h + d[idx + n * 4 + c] * h;
              f[idx + c] = Math.max(0, Math.min(255, v));
            }
            f[idx + 3] = d[idx + 3];
          }
        }
        ctx.putImageData(out, 0, 0);
        var blob = await canvasToBlob(canvas, 'image/png');
        if (result && result.url) URL.revokeObjectURL(result.url);
        result = { blob: blob, url: URL.createObjectURL(blob) };
        B.success('锐化完成');
      } catch (e) {
        B.error(e instanceof Error ? e.message : '锐化失败，请重试');
      } finally { busy = false; render(); }
    }

    var dropzone = createDropzone('sharpen-input', 'image/*', onFile);
    render();
    return el;
  }

  function OcrApp() {
    var file = null, previewUrl = null, busy = false, text = '';

    function render() {
      el.innerHTML = '';

        btn.className = 'btn btn-primary w-full'; btn.disabled = busy;
        if (busy) { btn.innerHTML = icon('loader-circle', 'spin') + '<span>识别中（首次需加载语言包）…</span>'; }
        else { btn.innerHTML = icon('scan-text') + '<span>提取文字</span>'; }
        btn.addEventListener('click', onExtract);
        body.appendChild(btn);

      }
      if (text) {

        rb.className = 'result-block space-y-3';
        var head = document.createElement('div');
        head.className = 'flex-between';
        head.innerHTML = '<span class="field-label" style="margin:0;">识别结果</span>';
        var copyBtn = document.createElement('button');
        copyBtn.className = 'btn btn-ghost btn-sm';
        copyBtn.innerHTML = icon('copy') + '<span>复制</span>';
        copyBtn.addEventListener('click', async function () {
          try { await navigator.clipboard.writeText(text); B.success('已复制到剪贴板'); }
          catch (e) { B.error('复制失败'); }
        });
        head.appendChild(copyBtn);
        rb.appendChild(head);
        var ta = document.createElement('textarea');
        ta.className = 'textarea'; ta.readOnly = true; ta.value = text;
        rb.appendChild(ta);
        el.appendChild(rb);
      }
    }

    function onFile(f) {
      if (!f.type.startsWith('image/')) { B.error('请上传图片格式的文件'); return; }
      file = f; text = '';
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(f);
      render();
    }
    async function onExtract() {
      if (!file || busy) return;
      busy = true; render();
      try {
        var img = await loadImage(file);
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
        var ctx = canvas.getContext('2d');
        if (!ctx) throw new Error('画布初始化失败');
        ctx.drawImage(img, 0, 0);
        var worker = await Tesseract.createWorker('chi_sim+eng', 1, { langPath: 'https://tessdata.projectnaptha.com/4.0.0_fast' });
        var res = await worker.recognize(canvas);
        var t = (res.data.text || '').trim();
        await worker.terminate();
        if (t) { text = t; B.success('文字提取完成'); }
        else { B.warning('未识别到文字，请尝试更清晰的图片'); }
      } catch (e) {
        B.error(e instanceof Error ? e.message : '文字提取失败，请重试');
      } finally { busy = false; render(); }
    }

    var dropzone = createDropzone('ocr-input', 'image/*', onFile);
    render();
    return el;
  }

  /* ============================================================

  function PdfApp() {
    var file = null, busy = false, resultBlob = null;
    var el = document.createElement('div');
    el.className = 'space-y-6';

    function render() {
      el.innerHTML = '';
      el.appendChild(dropzone);
      if (file) {
        var row = document.createElement('div');
        row.className = 'flex-between';
        row.innerHTML = '<span style="display:flex;align-items:center;gap:.5rem;font-size:.875rem;"><span class="file-text" style="color:var(--muted-fg);display:inline-flex;"></span><span class="name" style="color:var(--muted-fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span></span>';
        row.querySelector('.file-text').innerHTML = icon('file-text');
        row.querySelector('.name').textContent = file.name;
        el.appendChild(row);

        var btn = document.createElement('button');
        btn.className = 'btn btn-primary w-full'; btn.disabled = busy;
        if (busy) { btn.innerHTML = icon('loader-circle', 'spin') + '<span>转换中…</span>'; }
        else { btn.innerHTML = '<span>转换为 Word</span>'; }
        btn.addEventListener('click', onConvert);
        el.appendChild(btn);
      }
      if (resultBlob) {
        var rb = document.createElement('div');
        rb.className = 'result-block space-y-3';
        var p = document.createElement('p');
        p.className = 'field-label'; p.textContent = '转换成功，可下载 .doc 文档';
        rb.appendChild(p);
        var dl = document.createElement('button');
        dl.className = 'btn btn-secondary w-full';
        dl.innerHTML = icon('download') + '<span>下载 Word 文档</span>';
        dl.addEventListener('click', function () { downloadBlob(resultBlob, baseName(file.name) + '.doc'); });
        rb.appendChild(dl);
        el.appendChild(rb);
      }
    }

    function onFile(f) {
      if (f.type !== 'application/pdf' && !/\.pdf$/i.test(f.name)) { B.error('请上传 PDF 格式的文件'); return; }
      file = f; resultBlob = null; render();
    }
    async function onConvert() {
      if (!file || busy) return;
      busy = true; render();
      try {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
        var buf = await file.arrayBuffer();
        var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
        var all = '';
        for (var i = 1; i <= pdf.numPages; i++) {
          var page = await pdf.getPage(i);
          var content = await page.getTextContent();
          all += content.items.map(function (it) { return it.str || ''; }).join(' ') + '\n';
        }
        if (!all.trim()) { B.warning('该PDF未包含可提取的文字（可能是扫描件或图片型PDF）'); return; }
        var esc = function (s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
        var doc = '<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>' + esc(file.name) + '</title></head><body>' + all.split('\n').map(function (line) { return '<p>' + esc(line) + '</p>'; }).join('') + '</body></html>';
        resultBlob = new Blob(['\ufeff', doc], { type: 'application/msword' });
        B.success('转换完成');
      } catch (e) {
        B.error(e instanceof Error ? e.message : '转换失败，请检查文件');
      } finally { busy = false; render(); }
    }

    var dropzone = createDropzone('pdf-input', 'application/pdf,.pdf', onFile);
    render();
    return el;
  }

  function QrRecognizeApp() {
    var file = null, previewUrl = null, busy = false, text = '';

        copyBtn.addEventListener('click', async function () {

          catch (e) { B.error('复制失败'); }
        });
        head.appendChild(copyBtn);
        rb.appendChild(head);
        var ta = document.createElement('textarea');
        ta.className = 'textarea'; ta.readOnly = true; ta.value = text;
        rb.appendChild(ta);
        el.appendChild(rb);
      }
    }

    function onFile(f) {
      if (!f.type.startsWith('image/')) { B.error('请上传图片格式的文件'); return; }
      file = f; text = '';
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(f);
      render();
    }
    async function onRecognize() {
      if (!file || busy) return;
      busy = true; render();
      try {
        var url = URL.createObjectURL(file);
        var img = await new Promise(function (resolve, reject) {
          var im = new Image();
          im.onload = function () { resolve(im); };
          im.onerror = function () { reject(new Error('图片加载失败')); };
          im.src = url;
        });
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
        var ctx = canvas.getContext('2d');
        if (!ctx) throw new Error('画布初始化失败');
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var code = jsQR(imageData.data, imageData.width, imageData.height);
        if (!code || !code.data) { B.warning('未识别到二维码，请尝试更清晰的图片'); return; }
        text = code.data;
        B.success('二维码识别成功');
      } catch (e) {
        B.error(e instanceof Error ? e.message : '识别失败，请重试');
      } finally { busy = false; render(); }
    }

    var dropzone = createDropzone('qrr-input', 'image/*', onFile);
    render();
    return el;
  }

  function QrGenerateApp() {
    var input = '', qrUrl = null;

    function render() {
      el.innerHTML = '';

      ta.addEventListener('input', function () { input = ta.value; regenerate(); });
      wrap.appendChild(ta);
      el.appendChild(wrap);

      if (qrUrl) {
        var qb = document.createElement('div');
        qb.className = 'result-block';
        var box = document.createElement('div');

        var cw = document.createElement('div');

        dl.innerHTML = icon('download') + '<span>下载二维码</span>';

          var a = document.createElement('a');
          a.href = qrUrl; a.download = 'qrcode.png';
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
        });
        box.appendChild(dl);
        qb.appendChild(box);
        el.appendChild(qb);

    var timer = null;
    function regenerate() {
      var v = input.trim();
      if (!v) { qrUrl = null; return; }
      clearTimeout(timer);
      timer = setTimeout(function () {
        QRCode.toDataURL(v, { margin: 2, width: 512, color: { dark: '#010102', light: '#ffffff' } })
          .then(function (url) { qrUrl = url; render(); })
          .catch(function () { B.error('二维码生成失败'); });
      }, 200);
    }

    render();
    return el;
  }

  function openTool(toolId, name) {

  /* ============================================================
   * 卡片
   * ============================================================ */
  function renderCard(item, index) {
    var def = item.kind === 'tool' ? TOOL_MAP[item.toolId] : null;
    var isLink = item.kind === 'link';
    var card = document.createElement('div');
    card.className = 'card' + (manageMode ? ' grab' : ' clickable') + (isLink ? ' link-card' : '');

    var renaming = false;
    function draw() {
      card.innerHTML = '';
      var top = document.createElement('div');
      top.className = 'card-top';
      var idx = document.createElement('span');
      idx.className = 'card-index';
      idx.textContent = String(index + 1).padStart(2, '0');
      top.appendChild(idx);
      if (manageMode) top.innerHTML += icon('grip-vertical');
      else if (isLink) { var ext = document.createElement('span'); ext.className = 'link-ico'; ext.innerHTML = icon('external-link'); top.appendChild(ext); }
      card.appendChild(top);

      var body = document.createElement('div');
      body.className = 'card-body';
      var iconBox = document.createElement('div');
      iconBox.className = 'card-icon';
      if (isLink && item.icon) {
        var im = document.createElement('img');
        im.src = item.icon;
        im.alt = '';
        im.addEventListener('error', function () { iconBox.innerHTML = icon('external-link'); });
        iconBox.appendChild(im);
      } else {
        iconBox.innerHTML = icon(def ? def.icon : 'external-link');
      }
      body.appendChild(iconBox);

      if (renaming) {
        var row = document.createElement('div');
        row.className = 'rename-row';
        row.addEventListener('click', function (e) { e.stopPropagation(); });
        var inp = document.createElement('input');
        inp.className = 'rename-input'; inp.value = item.name;
        var ok = document.createElement('button');
        ok.className = 'btn btn-icon btn-ghost'; ok.innerHTML = icon('check');
        ok.style.color = 'var(--primary)';
        var cancel = document.createElement('button');
        cancel.className = 'btn btn-icon btn-ghost'; cancel.innerHTML = icon('x');
        cancel.style.color = 'var(--muted-fg)';
        function save() {
          var v = inp.value.trim();
          if (!v) { B.error('名称不能为空'); return; }
          item.name = v; renaming = false; saveJSON(ITEMS_KEY, items); renderGrid();
        }
        function cancelRename() { renaming = false; renderGrid(); }
        ok.addEventListener('click', save);
        cancel.addEventListener('click', cancelRename);
        inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') save(); if (e.key === 'Escape') cancelRename(); });
        setTimeout(function () { inp.focus(); }, 0);
        row.appendChild(inp); row.appendChild(ok); row.appendChild(cancel);
        body.appendChild(row);
      } else {
        var nameEl = document.createElement('span');
        nameEl.className = 'card-name';
        nameEl.textContent = item.name;
        body.appendChild(nameEl);
      }
      card.appendChild(body);

      if (manageMode && !renaming) {
        var actions = document.createElement('div');
        actions.className = 'card-actions';
        if (isLink) {
          var ed = document.createElement('button');
          ed.className = 'btn';
          ed.innerHTML = icon('pencil') + '<span>编辑</span>';
          ed.addEventListener('click', function (e) { e.stopPropagation(); openLinkDialog(item); });
          actions.appendChild(ed);
          var del = document.createElement('button');
          del.className = 'btn btn-danger';
          del.innerHTML = icon('trash-2') + '<span>删除</span>';
          del.addEventListener('click', function (e) {
            e.stopPropagation();
            items = items.filter(function (x) { return x.id !== item.id; });
            saveJSON(ITEMS_KEY, items);
            renderGrid();
          });
          actions.appendChild(del);
        } else {
          var rn = document.createElement('button');
          rn.className = 'btn';
          rn.innerHTML = icon('pencil') + '<span>重命名</span>';
          rn.addEventListener('click', function (e) { e.stopPropagation(); renaming = true; draw(); });
          actions.appendChild(rn);
        }
        card.appendChild(actions);
      }
    }

    card.addEventListener('click', function () {
      if (manageMode) return;
      if (isLink) { if (item.url) window.open(item.url, '_blank', 'noopener,noreferrer'); }
      else if (item.toolId) { openTool(item.toolId, item.name); }
    });
    if (manageMode) {
      card.setAttribute('draggable', 'true');
      card.dataset.index = index;
      card.addEventListener('dragstart', function (e) {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', item.id);
        dragIndex = index;
        card.classList.add('dragging');
      });
      card.addEventListener('dragover', function (e) {
        e.preventDefault();
        if (e.dataTransfer && hasFiles(e.dataTransfer)) {
          e.dataTransfer.dropEffect = 'copy';
          if (isLink) card.classList.add('icon-drop-over');
          return;
        }
        e.dataTransfer.dropEffect = 'move';
        setDragOver(card, index);
      });
      card.addEventListener('dragleave', function () {
        card.classList.remove('icon-drop-over');
        if (dragOverCard === card) {
          card.classList.remove('drag-over');
          dragOverCard = null;
        }
      });
      card.addEventListener('drop', function (e) {
        e.preventDefault();
        if (e.dataTransfer && hasFiles(e.dataTransfer)) {
          card.classList.remove('icon-drop-over');
          var file = e.dataTransfer.files && e.dataTransfer.files[0];
          if (!isLink) { B.error('仅收藏的网页可设置图标'); return; }
          if (!file || !file.type || !file.type.startsWith('image/')) { B.error('请拖入图片文件'); return; }
          readImageAsIcon(file, function (dataUri) {
            item.icon = dataUri;
            saveJSON(ITEMS_KEY, items);
            B.success('图标已更新');
            renderGrid();
          });
          return;
        }
        setDragOver(card, index);
      });
      card.addEventListener('dragend', finishDrag);
    }
    draw();
    return card;
  }

  /* ---------- 拖拽排序辅助 ---------- */
  function setDragOver(card, index) {
    if (dragOverCard && dragOverCard !== card) {
      dragOverCard.classList.remove('drag-over');
    }
    dragOverCard = card;
    dragOverIndex = index;
    card.classList.add('drag-over');
  }
  function finishDrag() {
    if (dragIndex !== null && dragOverIndex !== null && dragIndex !== dragOverIndex) {
      var arr = items.slice().sort(function (a, b) { return a.order - b.order; });
      var moved = arr.splice(dragIndex, 1)[0];
      arr.splice(dragOverIndex, 0, moved);
      arr.forEach(function (it, i) { it.order = i; });
      saveJSON(ITEMS_KEY, items);
    }
    dragIndex = null; dragOverIndex = null; dragOverCard = null;
    renderGrid();
  }
  function hasFiles(dt) {
    if (!dt || !dt.types) return false;
    for (var i = 0; i < dt.types.length; i++) {
      if (dt.types[i] === 'Files') return true;
    }
    return false;
  }

  /* ============================================================
   * 渲染主页
   * ============================================================ */
  function renderGrid() {
    var sorted = items.slice().sort(function (a, b) { return a.order - b.order; });
    var q = search.trim().toLowerCase();
    var filtered = q ? sorted.filter(function (it) { return it.name.toLowerCase().includes(q); }) : sorted;

    countEl.innerHTML = '共 <b>' + sorted.length + '</b> 个应用';

    gridEl.innerHTML = '';
    if (filtered.length === 0) {
      emptyState.classList.remove('hidden');
      emptyIcon.innerHTML = icon('search');
      emptyText.textContent = q ? '未找到匹配的应用或网页' : '暂无内容';
    } else {
      emptyState.classList.add('hidden');
      filtered.forEach(function (item, i) { gridEl.appendChild(renderCard(item, i)); });
    }
  }

  /* ---------- 头部控制 ---------- */
  function renderHeader() {
    manageBtn.innerHTML = manageMode ? icon('check') + '<span>完成</span>' : icon('settings') + '<span>管理</span>';
    manageBtn.className = 'btn ' + (manageMode ? 'btn-secondary' : 'btn-outline');
    addLinkBtn.style.display = manageMode ? '' : 'none';
    addLinkBtn.innerHTML = icon('plus') + '<span>添加网页</span>';
    manageHint.style.display = manageMode ? '' : 'none';
  }

  /* ---------- 图标上传/预览 ---------- */
  function readImageAsIcon(file, cb) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var MAX = 192;
        var scale = Math.min(1, MAX / Math.max(img.width, img.height));
        var cw = Math.max(1, Math.round(img.width * scale));
        var ch = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
        cb(canvas.toDataURL('image/png'));
      };
      img.onerror = function () { B.error('无法读取该图片'); };
      img.src = e.target.result;
    };
    reader.onerror = function () { B.error('图片读取失败'); };
    reader.readAsDataURL(file);
  }
  function updateIconPreview(src) {
    var prev = $('link-icon-preview');
    if (src && /^[a-z][a-z0-9+.-]*:/i.test(src)) {
      var im = document.createElement('img');
      im.src = src;
      im.alt = '';
      im.addEventListener('error', function () { prev.innerHTML = icon('external-link'); });
      prev.innerHTML = '';
      prev.appendChild(im);
    } else {
      prev.innerHTML = icon('external-link');
    }
  }
  function handleIconFile(file) {
    if (!file) return;
    if (!file.type || !file.type.startsWith('image/')) { B.error('请选择图片文件'); return; }
    readImageAsIcon(file, function (dataUri) {
      $('link-icon').value = dataUri;
      updateIconPreview(dataUri);
      B.success('图标已就绪，保存后生效');
    });
  }

  /* ---------- 添加/编辑网页弹窗 ---------- */
  function openLinkDialog(editItem) {
    editItem = (editItem && editItem.id) ? editItem : null;
    editingLinkId = editItem ? editItem.id : null;
    $('link-name').value = editItem ? editItem.name : '';
    $('link-url').value = editItem ? (editItem.url || '') : '';
    $('link-icon').value = editItem ? (editItem.icon || '') : '';
    $('link-title').textContent = editItem ? '编辑收藏网页' : '添加收藏网页';
    $('link-desc').textContent = editItem ? '修改网页名称、图标与地址' : '输入网页名称与地址，添加后可在主页点击跳转';
    $('link-submit').innerHTML = icon(editItem ? 'check' : 'plus') + '<span>' + (editItem ? '保存' : '添加') + '</span>';
    updateIconPreview(editItem ? (editItem.icon || '') : '');
    linkDialog.classList.remove('hidden'); linkDialogOpen = true;
    setTimeout(function () { $('link-name').focus(); }, 0);
  }
  function closeLinkDialog() { linkDialog.classList.add('hidden'); linkDialogOpen = false; editingLinkId = null; }
  function submitLink() {
    var name = $('link-name').value.trim();
    var raw = $('link-url').value.trim();
    var iconRaw = $('link-icon').value.trim();
    if (!name) { B.error('请填写网页名称'); return; }
    if (!raw) { B.error('请填写网页地址'); return; }
    var url;
    try {
      if (/\s/.test(raw)) throw new Error('invalid-url');
      url = normalizeUrl(raw);
      new URL(url);
    }
    catch (e) { B.error('网页地址格式不正确'); return; }
    var iconUrl = '';
    if (iconRaw) {
      try {
        iconUrl = /^[a-z][a-z0-9+.-]*:/i.test(iconRaw) ? iconRaw : normalizeUrl(iconRaw);
        new URL(iconUrl);
      }
      catch (e) { B.error('图标地址格式不正确'); return; }
    }
    if (editingLinkId) {
      var item = items.find(function (x) { return x.id === editingLinkId; });
      if (item) {
        item.name = name; item.url = url; item.icon = iconUrl;
        saveJSON(ITEMS_KEY, items);
        B.success('已更新收藏网页');
      }
    }
    else {
      var maxOrder = items.reduce(function (m, it) { return Math.max(m, it.order || 0); }, 0);
      items.push({ id: genId(), name: name, kind: 'link', url: url, icon: iconUrl, order: maxOrder + 1 });
      saveJSON(ITEMS_KEY, items);
      B.success('已添加收藏网页');
    }
    closeLinkDialog();
    renderGrid();
  }

  /* ---------- 事件绑定 ---------- */
  manageBtn.addEventListener('click', function () { manageMode = !manageMode; renderHeader(); renderGrid(); });
  addLinkBtn.addEventListener('click', function () { openLinkDialog(); });
  $('link-cancel').addEventListener('click', closeLinkDialog);
  $('link-submit').innerHTML = icon('plus') + '<span>添加</span>';
  $('link-submit').addEventListener('click', submitLink);
  $('link-url').addEventListener('keydown', function (e) { if (e.key === 'Enter') submitLink(); });
  var linkIconDrop = $('link-icon-drop'), linkIconFile = $('link-icon-file'), linkIconInput = $('link-icon');
  linkIconDrop.addEventListener('click', function () { linkIconFile.click(); });
  linkIconFile.addEventListener('change', function () { handleIconFile(linkIconFile.files && linkIconFile.files[0]); linkIconFile.value = ''; });
  linkIconDrop.addEventListener('dragover', function (e) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; linkIconDrop.classList.add('over'); });
  linkIconDrop.addEventListener('dragleave', function () { linkIconDrop.classList.remove('over'); });
  linkIconDrop.addEventListener('drop', function (e) {
    e.preventDefault(); linkIconDrop.classList.remove('over');
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    handleIconFile(f);
  });
  linkIconInput.addEventListener('input', function () { updateIconPreview(linkIconInput.value.trim()); });
  linkDialog.addEventListener('click', function (e) { if (e.target === linkDialog) closeLinkDialog(); });
  toolDialog.addEventListener('click', function (e) { if (e.target === toolDialog) closeTool(); });
  $('tool-close').addEventListener('click', closeTool);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (!toolDialog.classList.contains('hidden')) closeTool(); if (!linkDialog.classList.contains('hidden')) closeLinkDialog(); } });
  searchEl.addEventListener('input', function () { search = searchEl.value; renderGrid(); });

  /* ---------- 静态图标填充 ---------- */
  $('brand-icon').innerHTML = icon('layout-grid');
  $('search-icon').innerHTML = icon('search');

  /* ---------- 初始渲染 ---------- */
  renderHeader();
  renderGrid();
})();
</script>
</body>
</html>
